[project]
name = "smart-log-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "dotenv>=0.9.9",
    "google-genai>=1.55.0",
    "google-generativeai>=0.8.5",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "types-aiofiles>=24.1.0",
]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pyright]
include = ["smart-log-analyzer"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
